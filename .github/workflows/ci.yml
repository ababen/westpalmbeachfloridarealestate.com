name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.22.0
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      # Runs scripts/condos/validate.mjs, then astro build
      - run: npm run build
      - name: Check the Worker bundles
        run: node scripts/embed-assets.mjs && npx wrangler deploy --dry-run --outdir dist-worker
