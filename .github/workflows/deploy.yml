name: Deploy

# Deploys the site to the Cloudflare Worker whenever main changes.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID;
# until they exist the job is skipped instead of failing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional; building pages hide Street View without it.
      PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_KEY }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      # build (with the condo data validator) -> embed dist/ -> wrangler deploy
      - if: steps.creds.outputs.ok == 'true'
        run: npm run deploy
      - if: steps.creds.outputs.ok == 'true'
        name: Smoke test
        run: |
          for path in / /condos /listings /condos/la-clara; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://westpalmbeachfloridarealestate.com$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
