# Generates AI artist's renderings for completed buildings that don't have an image yet, using the
# GEMINI_API_KEY repository secret, and opens a pull request with the results for review.
name: Renderings

on:
  workflow_dispatch:
    inputs:
      max:
        description: Most renderings to generate in this run
        default: '10'
      slugs:
        description: Only these buildings (comma-separated slugs, optional)
        default: ''
  schedule:
    - cron: '17 14 * * 1' # Mondays, ~10 am Eastern

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check for the Gemini key
        id: key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret is not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.key.outputs.skip != 'true'

      - name: Generate renderings
        id: gen
        if: steps.key.outputs.skip != 'true'
        env:
          MAX: ${{ inputs.max || '10' }}
          SLUGS: ${{ inputs.slugs }}
        run: node scripts/condos/generate-renderings.mjs --max "$MAX" $SLUGS

      - name: Open a pull request
        if: steps.key.outputs.skip != 'true' && steps.gen.outputs.generated != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED: ${{ steps.gen.outputs.generated }}
        run: |
          npm run condos:check
          branch="renderings/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/images/condos src/data/buildings.json
          git commit -m "Add AI renderings: $GENERATED"
          git push -u origin "$branch"
          gh pr create --draft --title "AI renderings: $GENERATED" \
            --body "Generated by the Renderings workflow with Gemini for: $GENERATED. Check that each image resembles its building and shows no water for inland buildings before merging. Each is labelled \"Artist's rendering\" on the site."
