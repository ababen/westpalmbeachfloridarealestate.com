name = "westpalmbeachfloridarealestate"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

routes = [
  { pattern = "westpalmbeachfloridarealestate.com", custom_domain = true },
  { pattern = "www.westpalmbeachfloridarealestate.com", custom_domain = true },
]

# Lead form rate limit: 3 submissions per IP per minute (functions/api/lead.js).
[[ratelimits]]
name = "LEAD_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Lead form email settings (see functions/api/lead.js):
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put LEAD_TO_EMAIL
#   npx wrangler secret put LEAD_FROM_EMAIL
#   npx wrangler secret put TURNSTILE_SECRET
